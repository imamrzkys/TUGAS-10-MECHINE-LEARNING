{% extends 'base.html' %}
{% block title %}Kontak — TA-10 KNN{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-header text-center" style="background: linear-gradient(135deg, #ff8c00 0%, #ffa500 100%); color: white; border: none;">
          <h3 class="mb-0">Kontak</h3>
        </div>
        <div class="card-body text-center py-4">
          <div class="mb-4">
            <p class="mb-2"><strong>Nama:</strong> Imam Rizki Saputra</p>
            <p class="mb-2"><strong>NIM:</strong> 301230013</p>
            <p class="mb-4"><strong>Kelas:</strong> IF - 5B</p>
            <p class="text-muted mb-4">Silakan gunakan form di bawah untuk mengirim pesan (tidak benar-benar mengirim email).</p>
            <div class="mt-4">
              <a href="https://github.com/imamrzkys" target="_blank" class="btn" style="background: linear-gradient(135deg, #333 0%, #24292e 100%); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 600; text-decoration: none; display: inline-block;">
                GitHub
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-header text-center" style="background: linear-gradient(135deg, #e67e00 0%, #ff8c00 100%); color: white; border: none;">
          <h3 class="mb-0">Form Kontak</h3>
        </div>
        <div class="card-body">
          <form method="post" novalidate>
            <div class="mb-3">
              <label class="form-label">Nama</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Pesan</label>
              <textarea name="message" class="form-control" rows="4" required></textarea>
            </div>
            <div class="text-center">
              <button class="btn btn-lg" style="background: linear-gradient(135deg, #ff8c00 0%, #ffa500 100%); color: white; border: none; padding: 0.95rem 2rem; border-radius: 12px; font-weight: 700; box-shadow: 0 12px 32px rgba(255, 140, 0, 0.25);">Kirim</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
